name: CI
on:
  push:
    branches: [main, macos-13]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Engine, settings and bt-spoof fixture tests
        run: bash scripts/test.sh
  release-build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GUI/package-lock.json
      - name: Install libusb
        run: brew install libusb pkg-config
      - name: Install GUI dependencies
        run: cd GUI && npm ci
      - name: Build release zip (ad-hoc signed)
        run: bash scripts/package-release.sh
      - name: Smoke-test the bundle
        run: |
          app="build/release/Trackpad Anything.app"
          codesign --verify --strict "$app"
          test -x "$app/Contents/MacOS/TrackpadCompatGUI"
          for tool in usb-helper bt-spoof space-command; do test -x "$app/Contents/Resources/$tool"; done
          test -f "$app/Contents/Resources/GUI/index.html"
          test -f "$app/Contents/Resources/ThirdParty-libusb-COPYING.txt"
          # macos-15-intel is x86_64; the default native build must stay Intel.
          for bin in "$app/Contents/MacOS/TrackpadCompatGUI" "$app/Contents/Resources/usb-helper"; do
            echo "$bin: $(lipo -archs "$bin")"
            lipo -archs "$bin" | grep -q x86_64
          done
          ls -l build/release/*.zip
      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-release
          path: |
            build/release/*.zip
            build/release/*.sha256
          if-no-files-found: error
  publish-release:
    needs: [test, release-build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release zip
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-release
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes
